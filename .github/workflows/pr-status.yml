name: PR status labels

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync in-progress and needs-review labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/sync-pr-labels.sh "$PR_NUMBER"
