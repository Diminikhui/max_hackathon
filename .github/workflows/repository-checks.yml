name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run repository tests
        run: ./scripts/verify-repository.sh

  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Версия pnpm берётся из packageManager в package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck (packages, tests, mini app)
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Версия pnpm берётся из packageManager в package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install only locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses
        shell: bash
        run: |
          license_report="$(mktemp)"
          pnpm licenses list --json > "$license_report"
          unexpected="$({ jq -r 'keys[]' "$license_report" | grep -Ev '^(Apache-2\.0|BSD-2-Clause|BSD-3-Clause|ISC|MIT|MIT OR Apache-2\.0|MPL-2\.0|0BSD|BlueOak-1\.0\.0|CC0-1\.0|Unlicense)$'; } || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Dependency licenses outside the reviewed allowlist:"
            echo "$unexpected"
            exit 1
          fi

  tls-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject disabled TLS verification
        shell: bash
        run: |
          node_tls="NODE_TLS_REJECT_"'UNAUTHORIZED[[:space:]]*[:=][[:space:]]*['"'"'\"]?0'
          node_agent='rejectUnauthor''ized[[:space:]]*[:=][[:space:]]*false'
          python_client='ver''ify[[:space:]]*=[[:space:]]*false'
          go_client='InsecureSkip''Verify[[:space:]]*:[[:space:]]*true'
          cli_clients='curl[^;&|]*(--insecure|-[A-Za-z]*k[A-Za-z]*)|wget[^;&|]*--no-check-certificate'
          patterns="$node_tls|$node_agent|$python_client|$go_client|$cli_clients"
          if git grep -nEIi "$patterns" -- . \
            ':(exclude,glob)**/*.md' \
            ':(exclude).github/workflows/repository-checks.yml'; then
            echo "TLS verification must not be disabled. Use a process-local CA bundle instead."
            exit 1
          fi
