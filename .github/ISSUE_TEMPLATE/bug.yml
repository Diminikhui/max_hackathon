name: Ошибка
description: Воспроизводимая проблема в проекте
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение и журнал ошибки
      description: Не вставляйте токены, пароли и персональные данные.
