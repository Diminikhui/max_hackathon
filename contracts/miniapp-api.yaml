openapi: 3.1.0
info:
  title: MAX Hackathon Mini App Internal API
  version: 1.0.0
  description: Внутренний API собственного мини-приложения; не заявляется как публичный API.
x-internal: true
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Процесс работает.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /v1/session:
    post:
      operationId: createSession
      summary: Проверить MAX initData и создать часовую сессию.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [initData]
              properties:
                initData: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        "201":
          description: Сессия создана.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/CompanyNotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteSession
      summary: Завершить текущую сессию.
      responses:
        "204": { description: Сессия завершена. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/profile:
    get:
      operationId: getProfile
      summary: Получить профиль компании текущей сессии.
      responses:
        "200":
          description: Профиль компании в контракте v1; ИНН замаскирован.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/CompanyNotFound" }
  /v1/checklist:
    get:
      operationId: getChecklist
      summary: Получить перечень требований и пять счётчиков статусов.
      responses:
        "200":
          description: Перечень компании.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyChecklist" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/CompanyNotFound" }
  /v1/settings:
    get:
      operationId: getSettings
      summary: Получить настройки уведомлений компании.
      responses:
        "200":
          description: Настройки.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      operationId: putSettings
      summary: Сохранить настройки уведомлений компании.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "200":
          description: Настройки сохранены.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    Unauthenticated:
      description: Подпись или сессия недействительна.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default: { value: { error: UNAUTHENTICATED } }
    CompanyNotFound:
      description: У пользователя нет привязанной компании.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default: { value: { error: COMPANY_NOT_FOUND } }
    InvalidRequest:
      description: Некорректное тело запроса.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default: { value: { error: INVALID_REQUEST } }
    ServiceUnavailable:
      description: Серверная проверка MAX не настроена.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default: { value: { error: SERVICE_UNAVAILABLE } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    Session:
      type: object
      additionalProperties: false
      required: [token, expiresAt, companyId]
      properties:
        token: { type: string, minLength: 20 }
        expiresAt: { type: string, format: date-time }
        companyId: { type: string, minLength: 1 }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [enabled, earlySignals]
      properties:
        enabled: { type: boolean }
        earlySignals: { type: boolean }
    ProfileResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, companyId, inn, entityType, facts, isModel, updatedAt]
      properties:
        contractVersion: { $ref: "./v1/common.schema.json#/$defs/ContractVersion" }
        companyId: { $ref: "./v1/common.schema.json#/$defs/Id" }
        inn:
          type: string
          pattern: "^[0-9]{2}\\*{6}([0-9]{2}|\\*{2}[0-9]{2})$"
        entityType: { enum: [legal_entity, individual_entrepreneur] }
        displayName:
          type: string
          description: Для ИП не возвращается, потому что содержит ФИО.
        facts:
          type: array
          items: { $ref: "./v1/fact.schema.json" }
        isModel: { type: boolean }
        updatedAt: { $ref: "./v1/common.schema.json#/$defs/DateTime" }
    StatusCounts:
      type: object
      additionalProperties: false
      required: [applies, not_applies, insufficient_data, needs_review, out_of_coverage]
      properties:
        applies: { type: integer, minimum: 0 }
        not_applies: { type: integer, minimum: 0 }
        insufficient_data: { type: integer, minimum: 0 }
        needs_review: { type: integer, minimum: 0 }
        out_of_coverage: { type: integer, minimum: 0 }
    ChecklistItem:
      type: object
      additionalProperties: false
      required: [requirement, applicability]
      properties:
        requirement: { $ref: "./v1/requirement.schema.json" }
        applicability: { $ref: "./v1/applicability-result.schema.json" }
    CompanyChecklist:
      type: object
      additionalProperties: false
      required: [companyId, evaluatedAt, asOf, packs, items, statusCounts]
      properties:
        companyId: { type: string, minLength: 1 }
        evaluatedAt: { type: string, format: date-time }
        asOf: { type: string, format: date }
        packs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [packId, packVersion, itemCount]
            properties:
              packId: { type: string, minLength: 1 }
              packVersion: { type: integer, minimum: 1 }
              itemCount: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
        statusCounts: { $ref: "#/components/schemas/StatusCounts" }
security:
  - sessionToken: []
